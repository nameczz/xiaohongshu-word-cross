<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>单词纵横</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b456d'/%3E%3Cpath d='M14 16h36v32H14z' fill='%23fffaf2'/%3E%3Cpath d='M32 16v32M14 32h36' stroke='%231b456d' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./app/assets/style.css" />
  </head>
  <body>
    <div id="app" class="game-shell">
      <section id="view-home" class="view active">
        <header class="top-header">
          <div class="title-wrap">
            <h1>单词纵横</h1>
            <p>每天一盘，交叉记住英文单词</p>
          </div>
          <button id="open-settings" class="settings-trigger" type="button" aria-label="打开设置" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22">
              <path d="M12 8.75a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5Z" />
              <path d="M19.1 13.2c.06-.39.06-.8 0-1.2l1.43-1.12-1.5-2.6-1.7.68a7.7 7.7 0 0 0-1.04-.6L16.03 6h-3l-.27 1.8c-.37.15-.72.35-1.04.6l-1.7-.68-1.5 2.6L9.95 12a7.1 7.1 0 0 0 0 1.2l-1.43 1.12 1.5 2.6 1.7-.68c.32.25.67.45 1.04.6l.27 1.8h3l.26-1.8c.37-.15.72-.35 1.04-.6l1.7.68 1.5-2.6-1.43-1.12Z" />
            </svg>
          </button>
        </header>

        <div class="home-panel">
          <div class="home-toolbar">
            <div>
              <div class="home-kicker">今日练习</div>
              <h2>选一个主题开局</h2>
            </div>
            <div class="difficulty-wrap">
              <button id="difficulty-trigger" class="difficulty-trigger" type="button" aria-expanded="false" aria-controls="difficulty-switch">
                <span id="difficulty-label">简单</span><span aria-hidden="true">⌄</span>
              </button>
              <div class="difficulty-menu" id="difficulty-switch" hidden></div>
            </div>
          </div>

          <button id="continue-game" class="continue-card" type="button" hidden>
            <span class="continue-copy">
              <span class="card-eyebrow">继续上局</span>
              <strong id="continue-title">日常生活 · 普通</strong>
              <span id="continue-progress">已填 0 / 0 格</span>
            </span>
            <span class="continue-arrow" aria-hidden="true">→</span>
          </button>

          <button id="random-challenge" class="random-card" type="button">
            <span class="random-letters" aria-hidden="true"><i>W</i><i>O</i><i>W</i></span>
            <span class="random-copy">
              <span class="card-eyebrow">不知道选什么？</span>
              <strong>随机挑战</strong>
              <span id="random-subtitle">从 10 个主题里抽一局</span>
            </span>
            <span class="random-arrow" aria-hidden="true">↗</span>
          </button>

          <div class="theme-title">
            <span>主题词库</span>
          </div>
          <div id="theme-list" class="theme-list"></div>
        </div>
      </section>

      <section id="view-game" class="view">
        <header class="game-header">
          <button id="back-home" class="icon-btn" type="button" aria-label="返回首页">←</button>
          <div class="game-meta">
            <div id="game-title">主题 / 难度</div>
          </div>
          <div id="game-timer" aria-label="本局用时">00:00</div>
        </header>

        <div class="game-content">
          <div id="board-wrap" class="board-wrap"></div>
          <div class="hint-card">
            <div class="hint-head">
              <div class="hint-summary">
                <span id="active-direction">Across / 横向</span>
                <span id="word-status"></span>
              </div>
              <div class="hint-tools">
                <button
                  id="check-answer"
                  class="hint-tool-btn"
                  type="button"
                  aria-label="检查整盘答案"
                  title="检查整盘"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                    <path d="m5 12 4 4L19 6" />
                  </svg>
                </button>
                <div class="hint-menu-wrap">
                  <button
                    id="hint-trigger"
                    class="hint-tool-btn hint-trigger"
                    type="button"
                    aria-label="打开提示"
                    aria-expanded="false"
                    aria-controls="hint-actions"
                    title="使用提示"
                  >
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                      <path d="M9 18h6M10 21h4M8.5 14.5c-1.1-.9-1.8-2.3-1.8-3.9A5.3 5.3 0 0 1 12 5.3a5.3 5.3 0 0 1 5.3 5.3c0 1.6-.7 3-1.8 3.9-.7.6-1 1.2-1.1 1.8H9.6c-.1-.6-.4-1.2-1.1-1.8Z" />
                    </svg>
                  </button>
                  <div id="hint-actions" class="hint-actions" role="menu" aria-label="提示选项" hidden>
                    <button id="hint-meaning" class="hint-menu-item" type="button" role="menuitem">显示释义</button>
                    <button id="hint-first-letter" class="hint-menu-item" type="button" role="menuitem">补一字母</button>
                    <button id="hint-fill-cell" class="hint-menu-item" type="button" role="menuitem">填当前格</button>
                  </div>
                </div>
              </div>
            </div>
            <div id="active-clue" class="clue"></div>
            <div id="hint-message" class="hint-message" hidden></div>
          </div>
          <div id="letter-keyboard" class="letter-keyboard" role="group" aria-label="英文字母键盘"></div>
        </div>
      </section>

      <section id="view-result" class="view">
        <div class="result-wrap">
          <div class="result-hero">
            <div class="result-complete-badge"><span aria-hidden="true">✓</span> 今日完成</div>
            <div id="result-stars" class="result-stars"></div>
            <h2>漂亮收官！</h2>
            <p id="result-context" class="result-context"></p>
          </div>
          <div id="result-summary" class="result-summary"></div>
          <canvas id="result-card" width="1080" height="1350" aria-label="成绩卡片"></canvas>
          <div class="result-actions">
            <button id="save-result" class="btn primary" type="button">保存成绩卡</button>
            <button id="back-home-result" class="btn ghost" type="button">返回首页</button>
          </div>
          <div id="bridge-tip" class="bridge-tip" hidden>保存失败时，可以长按上方成绩卡图片保存。</div>
        </div>
      </section>
    </div>
    <div id="settings-overlay" class="settings-overlay" hidden>
      <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-head">
          <div>
            <span class="card-eyebrow">偏好设置</span>
            <h2 id="settings-title">让练习更顺手</h2>
          </div>
          <button id="close-settings" class="settings-close" type="button" aria-label="关闭设置">×</button>
        </div>
        <button id="sound-toggle" class="setting-row" type="button" aria-pressed="true">
          <span>
            <strong>游戏音效</strong>
            <small>输入与完成时播放轻提示音</small>
          </span>
          <span id="sound-state" class="toggle-pill" aria-hidden="true"><i></i></span>
        </button>
        <button id="reset-progress" class="setting-row danger" type="button">
          <span>
            <strong>重置学习记录</strong>
            <small>清除存档、星级和最佳用时</small>
          </span>
          <span aria-hidden="true">→</span>
        </button>
      </section>
    </div>
    <div id="toast" class="toast" aria-live="polite" hidden></div>
    <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
    <script src="./app/assets/js/words.js"></script>
    <script src="./app/assets/js/generator.js"></script>
    <script src="./app/assets/js/main.js"></script>
  </body>
</html>
